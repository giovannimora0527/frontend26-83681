name: clinica-veterinaria

services:
  db:
    image: mysql:8.0.46
    container_name: clinica-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-password}
      MYSQL_DATABASE: clinica
      TZ: America/Bogota
    ports:
      - "3308:3306"
    volumes:
      - clinica_mysql_data:/var/lib/mysql
      - ../clinica.sql:/docker-entrypoint-initdb.d/01-clinica.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: clinica-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend-83681
      dockerfile_inline: |
        FROM maven:3.9.9-eclipse-temurin-21 AS build
        WORKDIR /workspace
        COPY pom.xml ./
        COPY src ./src
        RUN mvn -B -DskipTests package

        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /app
        RUN apk add --no-cache wget \
            && addgroup -S app \
            && adduser -S app -G app
        COPY --from=build --chown=app:app /workspace/target/clinica-0.0.1-SNAPSHOT.jar /app/clinica.jar
        USER app
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/clinica.jar"]
    container_name: clinica-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-password}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: local@clinica.test
      SPRING_MAIL_PASSWORD: local-only
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "false"
      CLINICA_SWAGGER: "true"
      TZ: America/Bogota
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/clinica/v1/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  clinica_mysql_data:
