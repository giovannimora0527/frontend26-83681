<div class="container-fluid py-3">
 <h3>Gestión de Usuarios</h3>
 <p>Crear usuarios y asignar perfiles de acceso.</p>
 <div *ngIf="error" class="alert alert-danger" role="alert">{{error}}</div>
 <div *ngIf="mensaje" class="alert alert-success" role="status">{{mensaje}}</div>
 <div class="card mb-3"><div class="card-body">
  <h5>Crear usuario</h5>
  <form (ngSubmit)="guardar()" #form="ngForm">
   <div class="row g-3">
    <div class="col-md-4"><label class="form-label" for="username">Usuario</label>
     <input class="form-control" id="username" name="username" [(ngModel)]="nuevo.username" required maxlength="50" autocomplete="off"></div>
    <div class="col-md-4"><label class="form-label" for="email">Correo electrónico</label>
     <input class="form-control" id="email" name="email" type="email" [(ngModel)]="nuevo.email" required email autocomplete="off"></div>
    <div class="col-md-4"><label class="form-label" for="password">Contraseña</label>
     <input class="form-control" id="password" name="password" type="password" [(ngModel)]="nuevo.password" required minlength="8" autocomplete="new-password"></div>
    <div class="col-md-6"><label class="form-label" for="perfil">Perfil</label>
     <select class="form-select" id="perfil" name="perfilId" [(ngModel)]="nuevo.perfilId" required>
      <option [ngValue]="0">Seleccionar perfil</option>
      <option *ngFor="let p of perfiles" [ngValue]="p.perfilId">{{p.nombre}}</option>
     </select></div>
    <div class="col-md-6 d-flex align-items-end">
     <button class="btn btn-outline-secondary" type="button" [disabled]="guardando" (click)="habilitarDespacho()">Habilitar perfil DESPACHO_MEDICO</button>
    </div>
   </div>
   <button class="btn btn-primary mt-3" type="submit" [disabled]="guardando || !form.valid || !nuevo.perfilId">{{guardando?'Guardando...':'Crear usuario'}}</button>
  </form>
 </div></div>
 <div class="card"><div class="card-body"><h5>Usuarios registrados</h5>
  <button type="button" class="btn btn-outline-primary btn-sm mb-2" (click)="cargar()" [disabled]="cargando">Actualizar lista</button>
  <div class="table-responsive"><table class="table table-striped"><thead><tr><th>Usuario</th><th>Correo</th><th>Perfil</th><th>Estado</th></tr></thead>
  <tbody><tr *ngFor="let u of usuarios"><td>{{u.username}}</td><td>{{u.email}}</td><td>{{u.rol}}</td><td>{{u.activo?'Activo':'Inactivo'}}</td></tr></tbody></table></div>
 </div></div>
</div>
